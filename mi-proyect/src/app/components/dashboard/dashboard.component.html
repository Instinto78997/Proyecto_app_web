<div class="dashboard-container">
  <div class="sidebar">
    <div class="logo">
      <h2>Mi App</h2>
    </div>
    
    <ul class="nav-menu">
      <li>
        <a routerLink="/dashboard/home" routerLinkActive="active" class="nav-link">
          <span class="icon"></span>
          <span>Inicio</span>
        </a>
      </li>
      <li>
        <a routerLink="/dashboard/perfil" routerLinkActive="active" class="nav-link">
          <span class="icon"></span>
          <span>Perfil</span>
        </a>
      </li>
      <li>
        <a (click)="logout()" class="nav-link logout">
          <span class="icon"></span>
          <span>Cerrar sesión</span>
        </a>
      </li>
    </ul>
    
    <div class="user-info">
      <p>Bienvenido,</p>
      <p class="username">{{ currentUser?.username || 'Usuario' }}</p>
    </div>
  </div>

  <div class="main-content">
    <div class="header">
      <h1>Dashboard</h1>
    </div>
    
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
