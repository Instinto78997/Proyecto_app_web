<div class="perfil-container">
  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Cargando tu perfil...</p>
  </div>

  <div *ngIf="!loading" class="perfil-card">
    <div class="perfil-header">
      <h1>Mi Perfil</h1>
      <p>Gestiona tu información personal</p>
    </div>

    <div class="perfil-body">
      <div *ngIf="successMessage" class="mensaje exito">{{ successMessage }}</div>
      <div *ngIf="errorMessage" class="mensaje error">{{ errorMessage }}</div>

      <form [formGroup]="profileForm" (ngSubmit)="guardarPerfil()">
        
        <div class="foto-section">
          <div class="foto-container" (click)="fileInput.click()">
            <img *ngIf="selectedPhoto" [src]="selectedPhoto" class="foto-perfil" alt="Foto de perfil">
            <div *ngIf="!selectedPhoto" class="foto-default">+</div>
          </div>
          <input #fileInput type="file" accept="image/*" hidden (change)="onFotoSeleccionada($event)">
          <button type="button" class="btn-foto" (click)="fileInput.click()">Cambiar foto</button>
        </div>

        <div class="form-grid">
          <div class="campo">
            <label>Nombre</label>
            <input type="text" formControlName="nombre">
          </div>

          <div class="campo">
            <label>Email</label>
            <input type="email" formControlName="email">
          </div>

          <div class="campo">
            <label>Usuario</label>
            <input type="text" formControlName="username">
          </div>

          <div class="campo">
            <label>Teléfono</label>
            <input type="tel" formControlName="telephone">
          </div>

          <div class="campo">
            <label>Fecha nacimiento</label>
            <input type="date" formControlName="fecha_nacimiento">
          </div>

          <div class="campo">
            <label>Género</label>
            <select formControlName="genero">
              <option value="">Seleccionar</option>
              <option value="Masculino">Masculino</option>
              <option value="Femenino">Femenino</option>
              <option value="Otro">Otro</option>
            </select>
          </div>

          <div class="campo ancho-completo">
            <label>Dirección</label>
            <input type="text" formControlName="direccion">
          </div>

          <div class="campo ancho-completo">
            <label>Biografía</label>
            <textarea formControlName="bio" rows="3" placeholder="Cuéntanos un poco sobre ti..."></textarea>
          </div>
        </div>

        <div class="acciones">
          <button type="submit" class="btn-guardar" [disabled]="saving || profileForm.invalid">
            {{ saving ? 'Guardando...' : 'Guardar Cambios' }}
          </button>
          <button type="button" class="btn-cerrar" (click)="cerrarSesion()">Cerrar sesión</button>
        </div>
      </form>
    </div>
  </div>
</div>
